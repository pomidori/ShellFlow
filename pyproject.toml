[project]
name = "shellflow"
version = "0.1.0"
description = "Riemannian flow matching for LHC event generation on the product manifold R x S2 x R."
readme = "README.md"
authors = [
    { name = "Midori Kato" },
    { name = "Kevin A. Urquía-Calderón" },
    { name = "Inar Timiryasov" },
    { name = "Oleg Ruchayskiy" },
]
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.11",
    "awkward>=2.8.8",
    "huggingface-hub>=0.26",
    "lightning>=2.6.0",
    "matplotlib>=3.10.6",
    "numpy>=2.3.3",
    "pandas>=2.3.2",
    "psutil>=6.0",
    "pyyaml>=6.0",
    "scipy>=1.14",
    "torch>=2.10.0,<2.11",
    "tqdm>=4.67.1",
    "uproot>=5.6.5",
    "wandb>=0.25.1",
    "zarr>=3.1.5",
]

[project.optional-dependencies]
xrootd = [
    "xrootd>=5.9.1",
]
gatr = [
    "lgatr @ git+https://github.com/heidelberg-hepml/lgatr@86d3fb8ab6cbd591c9447a55dc01e553a8b1848d",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true  # the gatr extra pins lgatr to a git commit

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-cov>=6.0.0",
    "ruff>=0.13.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-v", "--tb=short", "-ra"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "requires_data: marks tests that require external data files",
    "gpu: marks tests that require GPU",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
